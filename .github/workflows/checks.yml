name: checks
# GeoSee CI gate (DEC-179: enforcement-gate adoption, DMT audit). Dormant until
# the repo has a GitHub remote; runs the guards on push/PR once it does.
on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -r tools/requirements-test.txt
      - run: npm ci
      # Blocking — currently green:
      - run: npm run check:routes
      - run: npm run check:mirror
      # Validates 61 preserved source groups and the staged Claude contract state.
      # check:mirror stays active until the actual adapter switchover.
      - run: npm run check:agent-contracts
      - run: npm run check:editor-controls
      - run: npm run check:agent-drag
      - run: npm run check:pages
      - run: npm run check:runtime-assets
      - run: npm run build
      # Full source suite: 679/679 on 2026-11-12. Failures must now block.
      - run: npm run test:tools
